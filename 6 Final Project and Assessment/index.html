
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Advanced To-Do List</h1>
    <p>Plan your day. Achieve your goals.</p>

    <section class="stats">
      <div>Total Tasks <h2 id="total">0</h2></div>
      <div>Completed <h2 id="completed">0</h2></div>
      <div>Pending <h2 id="pending">0</h2></div>
    </section>

    <form id="taskForm">
      <input id="taskInput" placeholder="Enter task name" required>
      <select id="priority">
        <option value="Medium">Medium Priority</option>
        <option value="High">High Priority</option>
        <option value="Low">Low Priority</option>
      </select>
      <input id="dueDate" type="date">
      <button type="submit">Add Task</button>
    </form>

    <input id="search" placeholder="Search tasks...">

    <select id="filter">
      <option value="All">All Tasks</option>
      <option value="Pending">Pending</option>
      <option value="Completed">Completed</option>
    </select>

    <div class="progress"><div id="progressBar"></div></div>
    <p id="progressText">0% completed</p>

    <ul id="taskList"></ul>
    <button id="clearBtn" class="clear">Clear All Tasks</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
